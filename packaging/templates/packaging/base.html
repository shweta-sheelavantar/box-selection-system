{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Box Selection System{% endblock %}</title>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Custom styles -->
  <link href="{% static 'packaging/style.css' %}" rel="stylesheet" />

  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg site-nav" aria-label="Main navigation">
    <div class="site-wrapper w-100 d-flex align-items-center py-2">

      <a class="navbar-brand me-auto" href="{% url 'home' %}">
        <i class="bi bi-box-seam" aria-hidden="true"></i>
        BoxSelect
      </a>

      <!-- Mobile toggle -->
      <button class="navbar-toggler border-0 shadow-none ms-2"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navMenu"
              aria-controls="navMenu"
              aria-expanded="false"
              aria-label="Toggle navigation">
        <i class="bi bi-list fs-5" style="color:var(--text-muted)"></i>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto d-flex align-items-center gap-1">
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/' %}active{% endif %}"
               href="{% url 'home' %}">
              <i class="bi bi-house me-1" aria-hidden="true"></i>Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if '/order/' in request.path and 'result' not in request.path %}active{% endif %}"
               href="{% url 'create_order' %}">
              <i class="bi bi-plus-circle me-1" aria-hidden="true"></i>New Order
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'admin:index' %}" target="_blank" rel="noopener">
              <i class="bi bi-sliders me-1" aria-hidden="true"></i>Admin
            </a>
          </li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- Page content -->
  <main class="site-main" id="main-content">
    <div class="site-wrapper">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer" role="contentinfo">
    <div class="site-wrapper">
      AI-Assisted Box Selection System &mdash; built with Django &amp; Bootstrap 5
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  {% block extra_js %}{% endblock %}
</body>
</html>
